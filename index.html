<style>:root{--brand:#253264;--brand2:#3d4f9c;--bg:#f5f6f8;--card:#fff;--line:#e5e7eb;--txt:#0f172a;--mut:#64748b;--red:#dc2626;--amber:#d97706;--green:#16a34a;--r:12px;--sh:0 1px 2px rgba(15,23,42,.06),0 1px 3px rgba(15,23,42,.05)}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--txt);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
body.noscroll{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand2)}
.mut{color:var(--mut)}.tiny{font-size:12px}.errt{color:var(--red)}
h1,h2,h3{margin:0;letter-spacing:-.01em}h1{font-size:24px}h2{font-size:18px}h3{font-size:15px}
.ic{flex:none;vertical-align:-3px}
/* botones */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 13px;font-weight:600;cursor:pointer;text-decoration:none;color:var(--txt);transition:.12s}
.btn:hover{background:#f1f5f9}.btn.sm{padding:5px 10px;font-size:12.5px}.btn.big{padding:13px 22px;font-size:15px;border-radius:12px}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}.btn.primary:hover{background:#1c2650}
.btn.danger{background:#fff;border-color:#fecaca;color:var(--red)}.btn.danger:hover{background:#fef2f2}.btn.ghost{border-color:transparent}
.btn:disabled{opacity:.5;cursor:not-allowed}
.ibtn{border:0;background:transparent;border-radius:8px;width:36px;height:36px;display:inline-grid;place-items:center;cursor:pointer;color:var(--mut);position:relative}
.ibtn:hover{background:#eef0f4;color:var(--txt)}.ibtn.sm{width:26px;height:26px}
.ibtn em,.side nav a em,.tabs a em{position:absolute;top:2px;right:0;background:var(--red);color:#fff;border-radius:9px;font-style:normal;font-size:10.5px;font-weight:700;padding:1px 5px;min-width:17px;text-align:center}
/* formularios */
.fl{display:flex;flex-direction:column;gap:5px;font-weight:600;font-size:12.5px;color:#334155;margin-bottom:12px}
input,select,textarea{border:1px solid #d5dae3;background:#fff;border-radius:9px;padding:9px 11px;width:100%;font-weight:400}
input:focus,select:focus,textarea:focus{outline:2px solid #c7d0f0;border-color:var(--brand2)}
textarea{resize:vertical}input[type=checkbox],input[type=range]{width:auto;padding:0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:520px){.row2{grid-template-columns:1fr}}
.pick{display:flex;flex-wrap:wrap;gap:7px;font-weight:500}
.pk{display:inline-flex;align-items:center;gap:7px;border:1px solid #d5dae3;border-radius:20px;padding:6px 12px;cursor:pointer;background:#fff;font-weight:500;font-size:13px;--c:var(--brand);user-select:none}
.pk input{display:none}.pk i{width:9px;height:9px;border-radius:50%;background:var(--c);opacity:.4}
.pk.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 11%,#fff);font-weight:600}.pk.on i{opacity:1}
.seg{display:inline-flex;background:#e9ecf2;border-radius:10px;padding:3px;margin:6px 0 14px}.seg.sm{margin:0 0 12px}
.seg button{border:0;background:transparent;padding:7px 16px;border-radius:8px;font-weight:600;cursor:pointer;color:var(--mut)}

const pad = n => String(n).padStart(2, '0');

const parseISO = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };

function isWorkday(s, cfg) { const dw = parseISO(s).getDay(); if (dw >= 1 && dw <= 5) return true; if (dw === 6) return !!(cfg && cfg.sat); return !!(cfg && cfg.sun); }

// ---- UI base
let rq = 0;
function scheduleRender() { if (rq) return; rq = requestAnimationFrame(() => { rq = 0; try { render(); } catch (e) { console.error(e); } }); }
function toast(msg, bad) { const t = $('#toast'); t.textContent = msg; t.className = 'show' + (bad ? ' bad' : ''); clearTimeout(toast.t); toast.t = setTimeout(() => t.className = '', 3200); }
function openModal(html, cls) { const m = $('#modal'); m.innerHTML = `<div class="bk" data-act="closeModal"></div><div class="sheet ${cls || ''}" role="dialog">${html}</div>`; m.className = 'open'; document.body.classList.add('noscroll'); }
function closeModal() { const m = $('#modal'); m.className = ''; m.innerHTML = ''; document.body.classList.remove('noscroll'); if (S.openId) { S.openId = null; unsubComments(); } }
async function guard(fn) { try { return await fn(); } catch (e) { console.error(e); toast('No se pudo guardar: ' + (e.code || e.message), true); } }

// ---- Imágenes (se comprimen en el dispositivo y se guardan como texto)
function readImage(file, maxSide, q, type) {
  return new Promise((res, rej) => {
    const fr = new FileReader(); fr.onerror = rej;
    fr.onload = () => { const im = new Image(); im.onerror = rej; im.onload = () => {
      const k = Math.min(1, maxSide / Math.max(im.width, im.height)), w = Math.max(1, Math.round(im.width * k)), h = Math.max(1, Math.round(im.height * k));
      const c = document.createElement('canvas'); c.width = w; c.height = h; const x = c.getContext('2d'); if (type === 'image/jpeg') { x.fillStyle = '#fff'; x.fillRect(0, 0, w, h); } x.drawImage(im, 0, 0, w, h);
      res(c.toDataURL(type || 'image/jpeg', q)); }; im.src = fr.result; };
    fr.readAsDataURL(file);
  });
}

// ---- Suscripciones
let subs = [], subSig = '', commentUnsub = null;
const unsubAll = () => { subs.forEach(f => { try { f() } catch (e) { } }); subs = []; subSig = ''; };
const snapList = s => s.docs.map(d => ({ id: d.id, ...d.data() }));
function listen(ref, key, post) { subs.push(onSnapshot(ref, s => { S[key] = post ? post(snapList(s)) : snapList(s); scheduleRender(); }, e => { console.error(key, e); S.err = key + ': ' + (e.code || e.message); scheduleRender(); })); }
const col = n => collection(db, n);
function subscribeData() {
  const m = me(); const sig = m ? [m.role, m.rank, m.team, arr(m.areas).join(','), isOwner()].join('|') : 'none';
  if (sig === subSig) return; unsubAll(); subSig = sig; if (!m) return;
  // siempre: configuración, áreas, equipos y avisos propios
  subs.push(onSnapshot(doc(db, 'config', 'main'), s => { if (s.exists()) S.cfg = { event: 'reto', temporadaEnabled: false, sat: false, sun: false, ...s.data() }; scheduleRender(); }));
  listen(col('areas'), 'areas', l => l.sort((a, b) => (a.order || 0) - (b.order || 0)));
  listen(col('teams'), 'teams');
  listen(query(col('notifications'), where('to', '==', S.auth.uid)), 'notifs');
  if (m.role === 'student' && m.team) {
    listen(query(col('tasks'), where('teamId', '==', m.team)), 'tasks');
    listen(query(col('users'), where('team', '==', m.team)), 'users');
    listen(col('masterTasks'), 'masters', l => l.sort((a, b) => (a.order || 0) - (b.order || 0)));
    listen(query(col('masterRuns'), where('teamId', '==', m.team)), 'runs');
    listen(query(col('changes'), where('uid', '==', S.auth.uid)), 'changes');
  } else if (m.role === 'mentor') {
    subs.push(onSnapshot(query(col('notifications'), where('to', '==', 'mentors')), s => { S.bnotifs = snapList(s); scheduleRender(); }));
    listen(col('users'), 'users');
    listen(col('masterTasks'), 'masters', l => l.sort((a, b) => (a.order || 0) - (b.order || 0)));
    listen(col('masterRuns'), 'runs');
    const ar = arr(m.areas);
    if (isCore(m)) { listen(col('tasks'), 'tasks'); listen(col('changes'), 'changes'); listen(col('reviews'), 'reviews'); }
    else if (ar.length) { listen(query(col('tasks'), where('areaId', 'in', ar.slice(0, 30))), 'tasks'); listen(query(col('changes'), where('areaId', 'in', ar.slice(0, 30))), 'changes'); listen(query(col('reviews'), where('areaId', 'in', ar.slice(0, 30))), 'reviews'); }
  }
}
function subComments(taskId) {
  unsubComments(); S.comments = [];
  const mm = me(); const cq = mm && mm.role === 'student' ? query(col('comments'), where('taskId', '==', taskId), where('teamId', '==', mm.team)) : query(col('comments'), where('taskId', '==', taskId));
  commentUnsub = onSnapshot(cq, s => { S.comments = snapList(s).sort((a, b) => a.at - b.at); if (S.openId === taskId) refreshTaskModal(); }, e => console.error('comments', e));
}
function unsubComments() { if (commentUnsub) { try { commentUnsub() } catch (e) { } commentUnsub = null; } }

// ---- Arranque de sesión
let userUnsub = null;
async function bootAuth(user) {
  if (userUnsub) { userUnsub(); userUnsub = null; } unsubAll();
  S.me = null; S.booted = false;
  if (!user) { S.auth = null; S.booted = true; return scheduleRender(); }
  S.auth = { uid: user.uid, email: user.email || '', name: user.displayName || '', photo: user.photoURL || '' };
  userUnsub = onSnapshot(doc(db, 'users', user.uid), async s => {
    if (s.exists()) { S.me = { id: s.id, ...s.data() }; S.booted = true; subscribeData(); scheduleRender(); }
    else if (isOwner()) { await guard(bootstrapOwner); }
    else { S.me = null; S.booted = true; subscribeData(); scheduleRender(); }
  }, e => { console.error(e); S.err = 'users: ' + (e.code || e.message); S.booted = true; scheduleRender(); });
}
async function bootstrapOwner() {
  const b = writeBatch(db);
  b.set(doc(db, 'users', S.auth.uid), { email: S.auth.email, name: S.auth.name || 'Mentor', photo: S.auth.photo, role: 'mentor', rank: 'core', areas: [], team: null, requested: 'mentor', createdAt: Date.now() });
  const exists = await getDoc(doc(db, 'config', 'main'));
  if (!exists.exists()) {
    b.set(doc(db, 'config', 'main'), { event: 'reto', temporadaEnabled: false, sat: false, sun: false });
    DEF_AREAS.forEach((a, i) => b.set(doc(db, 'areas', a.id), { ...a, order: i }));
    for (let i = 1; i <= 6; i++) b.set(doc(db, 'teams', 'reto-' + i), { event: 'reto', number: i, name: 'Equipo ' + i, color: DEF_TEAM_COLORS[i - 1], logo: '' });
    DEF_MASTERS.forEach((m, i) => b.set(doc(db, 'masterTasks', 'm' + (i + 1)), { ...m, active: true, order: i }));
  }
  await b.commit();
}

// ---- Avisos
// to: uid | 'mentors' (difusión a mentores; los de rango Mentor solo ven los de su área)
async function notify(items) {
  const b = writeBatch(db); let n = 0; const at = Date.now();
  items.forEach(i => { if (!i.to) return; b.set(doc(col('notifications')), { to: i.to, type: i.type || '', text: i.text, taskId: i.taskId || '', areaId: i.areaId || '', at, read: false, readBy: [] }); n++; });
  if (n) await b.commit();
}
const notifFor = (uids, text, extra) => uids.filter(Boolean).filter(u => u !== S.auth.uid).map(u => ({ to: u, text, ...extra }));
const toMentors = (text, extra) => [{ to: 'mentors', text, ...extra }];
function myNotifs() {
  const m = me(), list = S.notifs.slice();
  if (amMentor()) S.bnotifs.filter(n => !n.areaId || inScopeArea(m, n.areaId)).forEach(n => list.push({ ...n, read: arr(n.readBy).includes(S.auth.uid), broadcast: true }));
  return list.sort((a, b) => b.at - a.at);
}
async function markRead(n) { if (n.read) return; await guard(() => n.broadcast ? updateDoc(doc(db, 'notifications', n.id), { readBy: arrayUnion(S.auth.uid) }) : updateDoc(doc(db, 'notifications', n.id), { read: true })); }

  else await notify(notifFor(who, `Nueva tarea: ${t.title}, vence ${fmtDate(t.due)}`, { type: 'assign', taskId: ref.id }));
  return ref.id;
}
async function updateTask(t, d) { await updateDoc(doc(db, 'tasks', t.id), { ...d, updatedAt: Date.now() }); }

  const d = { status }; if (status === 'review') { d.submittedAt = Date.now(); if (!t.firstSubmittedAt) d.firstSubmittedAt = Date.now(); }
  await updateTask(t, d);
  if (status === 'review') await notify(toMentors(`${me().name} entregó "${t.title}" a revisión`, { type: 'review', taskId: t.id, areaId: t.areaId }));
}
async function approveDone(t, scores) {
  const b = writeBatch(db);
  b.update(doc(db, 'tasks', t.id), { status: 'done', doneAt: Date.now(), updatedAt: Date.now() });
  Object.keys(scores).forEach(u => b.set(doc(db, 'reviews', t.id + '_' + u), { taskId: t.id, uid: u, areaId: t.areaId, score: scores[u], by: S.auth.uid, at: Date.now() }));
  await b.commit();
  await notify(notifFor(assigneesOf(t), `Tu tarea "${t.title}" fue aprobada`, { type: 'done', taskId: t.id }));
}

}

async function decideChange(c, ok) {
  const t = S.tasks.find(x => x.id === c.taskId);
  const b = writeBatch(db); b.update(doc(db, 'changes', c.id), { status: ok ? 'approved' : 'rejected', decidedBy: S.auth.uid, decidedAt: Date.now() });

function confChart(series) {

}

    <div class="blk"><div class="blk-h"><b>Tareas</b><em>${tasks.length}</em></div>${tasks.map(taskRow).join('') || '<p class="mut tiny">Sin tareas.</p>'}</div>`;
  } else if (u.role === 'mentor') {
    body += `<div class="kv"><span>Rango</span><b>${u.rank === 'core' ? 'Mentor Core' : 'Mentor (solo su área)'}</b></div>${owner && u.id !== S.auth.uid ? `<label class="fl">Rango${sel('mkR', [['area', 'Mentor (solo su área)'], ['core', 'Mentor Core (todo)']], u.rank || 'area', 'data-chg="mkRank"')}</label><div class="fl" id="mkAreas" ${u.rank === 'core' ? 'style="display:none"' : ''}>Áreas<div class="pick">${S.areas.map(a => `<label class="pk ${arr(u.areas).includes(a.id) ? 'on' : ''}" style="--c:${esc(a.color)}"><input type="checkbox" class="mkA" value="${a.id}" ${arr(u.areas).includes(a.id) ? 'checked' : ''}><i></i>${esc(a.name)}</label>`).join('')}</div></div><div class="acts"><button class="btn primary" data-act="mkSave" data-id="${u.id}">Guardar rango</button><button class="btn danger ghost" data-act="personOff" data-id="${u.id}">Quitar acceso</button></div>` : '<p class="mut tiny">Solo el dueño puede cambiar rangos.</p>'}`;
  } else body += `<div class="acts"><button class="btn primary" data-act="personOn" data-id="${u.id}">Reactivar</button></div>`;
  openModal(`<div class="sh-h"><div class="pph">${avatar(u)}<h3>${esc(u.name)}</h3></div><button class="ibtn" data-act="closeModal">${svgi('x')}</button></div><div class="sh-b">${body}</div>`, 'wide');
};
ACT.personSave = el => { const team = $('#pTeam').value || null, areas = $$('.pA:checked').map(i => i.value); if (!areas.length) return toast('Elige al menos un área', true); guard(async () => { await patchUser(el.dataset.id, { team, areas }); closeModal(); toast('Guardado'); }); };
ACT.personOff = el => { if (!confirm('¿Quitar el acceso? Sus tareas se conservan.')) return; guard(async () => { await deactivateUser(el.dataset.id); closeModal(); toast('Acceso desactivado'); }); };
ACT.personOn = el => guard(async () => { await reactivateUser(el.dataset.id); closeModal(); toast('Pasó a solicitudes'); });
ACT.mkSave = el => { const rank = $('#mkR').value, areas = $$('.mkA:checked').map(i => i.value); if (rank === 'area' && !areas.length) return toast('Elige al menos un área', true); guard(async () => { await patchUser(el.dataset.id, { rank, areas }); closeModal(); toast('Rango actualizado'); }); };

// ----- Tareas maestras
function vMaestras() {
  const d = S.masterDate || today(); S.masterDate = d; const ms = S.masters.filter(x => x.active), teams = evTeams();
  const grid = ms.map(mt => `<div class="card">${secH(esc(mt.title), null, `<span class="mut tiny">${mt.photoRequired ? 'con foto' : 'sin foto'}</span>`)}<div class="mgrid">${teams.map(t => { const r = runOf(d, t.id, mt.id), st = r ? r.status : 'todo'; return `<div class="mcell m-${st}"><div class="mc-h">${teamDot(t.id)}<b>${esc(t.name)}</b></div><span class="mst m-${st}">${{ todo: 'Sin enviar', review: 'En revisión', done: 'Aprobada', returned: 'Regresada' }[st]}</span>${r && safeImg(r.photo) ? `<img class="thumb big" src="${safeImg(r.photo)}" alt="">` : ''}${r && r.status === 'review' ? `<div class="rbt"><button class="btn primary sm" data-act="runOk" data-id="${r.id}">Aprobar</button><button class="btn sm" data-act="runNo" data-id="${r.id}">Regresar</button></div>` : ''}</div>`; }).join('')}</div></div>`).join('');
  return `<div class="cal-h"><button class="ibtn" data-act="mdNav" data-n="-1">‹</button><h3>${fmtDate(d)}${d === today() ? ' · hoy' : ''}</h3><button class="ibtn" data-act="mdNav" data-n="1">›</button><button class="btn sm" data-act="mdNav" data-n="0">Hoy</button></div>
  ${isWorkday(d, S.cfg) ? '' : '<div class="warn">Este día no es de trabajo (activa sábado o domingo en Ajustes).</div>'}${grid || empty('No hay tareas maestras activas')}
  <div class="card">${secH('Administrar tareas maestras', S.masters.length, `<button class="btn sm" data-act="mtNew">${svgi('plus', 14)} Nueva</button>`)}${S.masters.map(m => `<div class="req"><div><b>${esc(m.title)}</b><span class="tiny mut">${m.photoRequired ? 'Lleva foto' : 'Sin foto'} · ${m.active ? 'Activa' : 'Pausada'}</span></div><div class="rbt"><button class="btn sm" data-act="mtEdit" data-id="${m.id}">Editar</button><button class="btn sm" data-act="mtToggle" data-id="${m.id}">${m.active ? 'Pausar' : 'Activar'}</button></div></div>`).join('')}</div>`;
}
ACT.mdNav = el => { const n = Number(el.dataset.n); S.masterDate = n ? addDays(S.masterDate || today(), n) : today(); scheduleRender(); };
ACT.runOk = el => guard(async () => { await decideRun(S.runs.find(r => r.id === el.dataset.id), true); toast('Aprobada'); });
ACT.runNo = el => { const r = S.runs.find(x => x.id === el.dataset.id); const c = prompt('¿Qué falta? (opcional)', ''); if (c === null) return; guard(async () => { await decideRun(r, false, c.trim()); toast('Regresada'); }); };
const mtForm = m => openModal(`<div class="sh-h"><h3>${m ? 'Editar' : 'Nueva'} tarea maestra</h3><button class="ibtn" data-act="closeModal">${svgi('x')}</button></div><div class="sh-b"><label class="fl">Nombre<input id="mtT" value="${esc(m ? m.title : '')}" placeholder="Ej. Dejar recogida la mesa"></label><label class="pk ${!m || m.photoRequired ? 'on' : ''}"><input type="checkbox" id="mtP" ${m && m.photoRequired ? 'checked' : ''}><i></i>Lleva foto como evidencia</label><p class="tiny mut">Aparece todos los días de trabajo para todos los equipos.</p><div class="acts"><button class="btn primary" data-act="mtSave" data-id="${m ? m.id : ''}">Guardar</button></div></div>`);
ACT.mtNew = () => mtForm(null); ACT.mtEdit = el => mtForm(S.masters.find(x => x.id === el.dataset.id));
ACT.mtSave = el => { const title = $('#mtT').value.trim(); if (!title) return toast('Falta el nombre', true); guard(async () => { const id = el.dataset.id; if (id) await updateDoc(doc(db, 'masterTasks', id), { title, photoRequired: $('#mtP').checked }); else await setDoc(doc(col('masterTasks')), { title, photoRequired: $('#mtP').checked, active: true, order: S.masters.length }); closeModal(); toast('Guardado'); }); };
ACT.mtToggle = el => guard(() => { const m = S.masters.find(x => x.id === el.dataset.id); return updateDoc(doc(db, 'masterTasks', m.id), { active: !m.active }); });

// ----- Ajustes
function vConfig() {
  const teams = evTeams();
  return `<div class="card">${secH('Evento activo')}<div class="seg"><button class="${S.cfg.event === 'reto' ? 'on' : ''}">Reto interno</button><button disabled title="Todavía deshabilitada">Temporada</button></div><p class="tiny mut">Temporada está deshabilitada por ahora. Cada tarea pertenece a un evento.</p></div>
  <div class="card">${secH('Días de trabajo')}<p class="tiny mut">De lunes a viernes siempre. Agrega fin de semana si hace falta.</p><div class="pick"><label class="pk ${S.cfg.sat ? 'on' : ''}"><input type="checkbox" data-chg="cfgDay" data-k="sat" ${S.cfg.sat ? 'checked' : ''}><i></i>Sábado</label><label class="pk ${S.cfg.sun ? 'on' : ''}"><input type="checkbox" data-chg="cfgDay" data-k="sun" ${S.cfg.sun ? 'checked' : ''}><i></i>Domingo</label></div></div>
  <div class="card">${secH('Equipos', teams.length, `<button class="btn sm" data-act="teamNew">${svgi('plus', 14)} Equipo</button>`)}${teams.map(t => `<div class="req"><div class="trow">${teamDot(t.id)}<div><b>${esc(t.name)}</b><span class="tiny mut">Equipo ${t.number} · <i class="sw" style="background:${esc(t.color)}"></i>${esc(t.color)}</span></div></div><div class="rbt"><button class="btn sm" data-act="teamEdit" data-id="${t.id}">Editar</button></div></div>`).join('') || empty('Sin equipos')}</div>
  <div class="card">${secH('Áreas', S.areas.length, `<button class="btn sm" data-act="areaNew">${svgi('plus', 14)} Área</button>`)}${S.areas.map(a => `<div class="req"><div class="trow">${areaChip(a.id)}<span class="tiny mut">${esc(a.color)}</span></div><div class="rbt"><button class="btn sm" data-act="areaEdit" data-id="${a.id}">Editar</button></div></div>`).join('')}</div>`;
}
CHG.cfgDay = el => guard(() => saveCfg({ [el.dataset.k]: el.checked }));
let TF = null;
function teamForm(t) { TF = { id: t ? t.id : '', logo: t ? t.logo || '' : '' }; openModal(`<div class="sh-h"><h3>${t ? 'Editar' : 'Nuevo'} equipo</h3><button class="ibtn" data-act="closeModal">${svgi('x')}</button></div><div class="sh-b">
  <div class="row2"><label class="fl">Número<input id="tmN" type="number" min="1" value="${t ? t.number : evTeams().reduce((a, x) => Math.max(a, x.number || 0), 0) + 1}"></label><label class="fl">Nombre<input id="tmName" value="${esc(t ? t.name : '')}" placeholder="Nombre del equipo"></label></div>
  <div class="row2"><label class="fl">Color (HEX)<input id="tmC" value="${esc(t ? t.color : DEF_TEAM_COLORS[0])}" placeholder="#2563eb"></label><div class="fl">Logo<div class="logoup"><span id="tmPrev">${TF.logo ? `<img src="${safeImg(TF.logo)}" alt="">` : '—'}</span><label class="btn sm">Subir<input type="file" accept="image/*" hidden data-chg="tmFile"></label></div></div></div>
  <div class="acts"><button class="btn primary" data-act="teamSave">Guardar</button></div></div>`); }
ACT.teamNew = () => teamForm(null); ACT.teamEdit = el => teamForm(teamOf(el.dataset.id));
CHG.tmFile = async el => { const f = el.files[0]; if (!f) return; try { TF.logo = await readImage(f, 256, 0.9, 'image/png'); $('#tmPrev').innerHTML = `<img src="${TF.logo}" alt="">`; } catch (e) { toast('No se pudo leer la imagen', true); } };
ACT.teamSave = () => { const n = Number($('#tmN').value), name = $('#tmName').value.trim() || 'Equipo ' + n, c = $('#tmC').value.trim(); if (!n) return toast('Falta el número', true); if (!validHex(c)) return toast('El color debe ser un HEX como #2563eb', true); guard(async () => { const id = TF.id || S.cfg.event + '-' + n; await setDoc(doc(db, 'teams', id), { event: S.cfg.event, number: n, name, color: c, logo: TF.logo || '' }, { merge: true }); closeModal(); toast('Equipo guardado'); }); };
let AF = null;
function areaForm(a) { AF = a ? a.id : ''; openModal(`<div class="sh-h"><h3>${a ? 'Editar' : 'Nueva'} área</h3><button class="ibtn" data-act="closeModal">${svgi('x')}</button></div><div class="sh-b"><label class="fl">Nombre<input id="arN" value="${esc(a ? a.name : '')}"></label><label class="fl">Color (HEX)<input id="arC" value="${esc(a ? a.color : '#0891b2')}"></label><div class="acts"><button class="btn primary" data-act="areaSave">Guardar</button></div></div>`); }
ACT.areaNew = () => areaForm(null); ACT.areaEdit = el => areaForm(areaOf(el.dataset.id));
ACT.areaSave = () => { const name = $('#arN').value.trim(), c = $('#arC').value.trim(); if (!name) return toast('Falta el nombre', true); if (!validHex(c)) return toast('El color debe ser un HEX como #dc2626', true); guard(async () => { const id = AF || slug(name) + uid8().slice(0, 3); await setDoc(doc(db, 'areas', id), { name, color: c, order: AF ? (areaOf(AF).order || 0) : S.areas.length }, { merge: true }); closeModal(); toast('Área guardada'); }); };

// ---------- Render principal y arranque ----------
const VIEWS = { mis: vMis, equipo: vEquipo, cal: calendarHTML, solicitar: vSolicitar, solicitudes: vSolicitudes, panel: vPanel, bandeja: vBandeja, tablero: vTablero, lista: vLista, alumnos: vAlumnos, maestras: vMaestras, config: vConfig };
function render() {
  const el = $('#app');
  if (!FB_CONFIG) { el.innerHTML = setupHTML(); return; }
  if (!S.booted) { el.innerHTML = loadingHTML(); return; }
  if (!S.auth) { el.innerHTML = loginHTML(); return; }
  const m = me();
  if (!m) { el.innerHTML = registerHTML(); return; }
  if (m.role === 'pending') { el.innerHTML = waitHTML('pending'); return; }
  if (m.role === 'rejected') { el.innerHTML = waitHTML('rejected'); return; }
  if (m.role === 'inactive') { el.innerHTML = waitHTML('inactive'); return; }
  if (m.role === 'student' && !m.team) { el.innerHTML = waitHTML('noteam'); return; }
  const r = route();
  // no redibujar mientras se escribe en la página (evita perder lo tecleado)
  const ae = document.activeElement; if (ae && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName) && el.contains(ae) && ae.dataset && ae.dataset.inp) { const v = ae.value, s = ae.selectionStart; el.innerHTML = shellHTML(VIEWS[r](), r); const n = $('#' + ae.id); if (n) { n.focus(); try { n.setSelectionRange(s, s); } catch (e) { } } }
  else el.innerHTML = shellHTML(VIEWS[r](), r);
  refreshTaskModal();
}
window.addEventListener('hashchange', () => { S.calDay = null; scheduleRender(); });

document.addEventListener('click', e => {
  const a = e.target.closest('[data-act]'); if (!a) return; const f = ACT[a.dataset.act]; if (!f) return;
  if (a.tagName !== 'A' && a.type !== 'checkbox') e.preventDefault(); f(a, e);
});
document.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('[data-act][tabindex]')) { e.preventDefault(); e.target.click(); } if (e.key === 'Escape' && $('#modal').className === 'open') closeModal(); });
document.addEventListener('change', e => { const t = e.target; if (t.dataset && t.dataset.chg && CHG[t.dataset.chg]) CHG[t.dataset.chg](t, e); if (t.matches && t.matches('.pk input')) t.closest('.pk').classList.toggle('on', t.checked); });
document.addEventListener('input', e => { const t = e.target; if (t.dataset && t.dataset.inp === 'fQ') { S.f.q = t.value; scheduleRender(); } });

// ---- Acceso
ACT.login = async () => {
  S.err = ''; try { const p = new GoogleAuthProvider(); p.setCustomParameters({ prompt: 'select_account' }); await signInWithPopup(auth, p); }
  catch (e) { if (e.code === 'auth/popup-blocked') { try { await signInWithRedirect(auth, new GoogleAuthProvider()); } catch (x) { S.err = 'No se pudo abrir el acceso con Google.'; } } else if (e.code !== 'auth/popup-closed-by-user' && e.code !== 'auth/cancelled-popup-request') S.err = 'No se pudo iniciar sesión (' + (e.code || e.message) + ')'; scheduleRender(); }
};
ACT.logout = async () => { unsubAll(); closeModal(); await signOut(auth); };
ACT.regMode = el => { R.name = ($('#rgName') || {}).value || R.name; R.mode = el.dataset.m; scheduleRender(); };
CHG.regArea = el => { R.areas = el.checked ? [...new Set([...R.areas, el.value])] : R.areas.filter(x => x !== el.value); if (R.mode === 'mentor' && R.areas.length > 1 && el.checked) { /* el mentor puede tener varias áreas */ } };
ACT.regSend = () => { const name = $('#rgName').value.trim(); R.name = name; if (name.split(/\s+/).length < 2) return toast('Escribe tu nombre completo', true); if (!R.areas.length) return toast('Elige al menos un área', true); guard(async () => { await register({ requested: R.mode, name, areas: R.areas }); R.name = ''; R.areas = []; R.mode = 'student'; toast('Solicitud enviada'); }); };

(function boot() {
  if (!FB_CONFIG) { S.booted = true; return render(); }
  app = initializeApp(FB_CONFIG); auth = getAuth(app);
  try { db = initializeFirestore(app, { localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) }); } catch (e) { db = getFirestore(app); }
  getRedirectResult(auth).catch(e => { S.err = 'No se pudo iniciar sesión (' + (e.code || e.message) + ')'; scheduleRender(); });
  onAuthStateChanged(auth, bootAuth);
  render();
})();

</script></body></html>
