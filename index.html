<style>:root{--brand:#253264;--brand2:#3d4f9c;--bg:#f5f6f8;--card:#fff;--line:#e5e7eb;--txt:#0f172a;--mut:#64748b;--red:#dc2626;--amber:#d97706;--green:#16a34a;--r:12px;--sh:0 1px 2px rgba(15,23,42,.06),0 1px 3px rgba(15,23,42,.05)}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--txt);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
body.noscroll{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand2)}
.mut{color:var(--mut)}.tiny{font-size:12px}.errt{color:var(--red)}
h1,h2,h3{margin:0;letter-spacing:-.01em}h1{font-size:24px}h2{font-size:18px}h3{font-size:15px}
.ic{flex:none;vertical-align:-3px}
/* botones */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 13px;font-weight:600;cursor:pointer;text-decoration:none;color:var(--txt);transition:.12s}
.btn:hover{background:#f1f5f9}.btn.sm{padding:5px 10px;font-size:12.5px}.btn.big{padding:13px 22px;font-size:15px;border-radius:12px}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}.btn.primary:hover{background:#1c2650}
.btn.danger{background:#fff;border-color:#fecaca;color:var(--red)}.btn.danger:hover{background:#fef2f2}.btn.ghost{border-color:transparent}
.btn:disabled{opacity:.5;cursor:not-allowed}
.ibtn{border:0;background:transparent;border-radius:8px;width:36px;height:36px;display:inline-grid;place-items:center;cursor:pointer;color:var(--mut);position:relative}
.ibtn:hover{background:#eef0f4;color:var(--txt)}.ibtn.sm{width:26px;height:26px}
.ibtn em,.side nav a em,.tabs a em{position:absolute;top:2px;right:0;background:var(--red);color:#fff;border-radius:9px;font-style:normal;font-size:10.5px;font-weight:700;padding:1px 5px;min-width:17px;text-align:center}
/* formularios */
.fl{display:flex;flex-direction:column;gap:5px;font-weight:600;font-size:12.5px;color:#334155;margin-bottom:12px}
input,select,textarea{border:1px solid #d5dae3;background:#fff;border-radius:9px;padding:9px 11px;width:100%;font-weight:400}
input:focus,select:focus,textarea:focus{outline:2px solid #c7d0f0;border-color:var(--brand2)}
textarea{resize:vertical}input[type=checkbox],input[type=range]{width:auto;padding:0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:520px){.row2{grid-template-columns:1fr}}
.pick{display:flex;flex-wrap:wrap;gap:7px;font-weight:500}
.pk{display:inline-flex;align-items:center;gap:7px;border:1px solid #d5dae3;border-radius:20px;padding:6px 12px;cursor:pointer;background:#fff;font-weight:500;font-size:13px;--c:var(--brand);user-select:none}
.pk input{display:none}.pk i{width:9px;height:9px;border-radius:50%;background:var(--c);opacity:.4}
.pk.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 11%,#fff);font-weight:600}.pk.on i{opacity:1}
.seg{display:inline-flex;background:#e9ecf2;border-radius:10px;padding:3px;margin:6px 0 14px}.seg.sm{margin:0 0 12px}
.seg button{border:0;background:transparent;padding:7px 16px;border-radius:8px;font-weight:600;cursor:pointer;color:var(--mut)}
.seg button.on{background:#fff;color:var(--txt);box-shadow:var(--sh)}.seg button:disabled{opacity:.45;cursor:not-allowed}
/* pantallas de acceso */
.center{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center;max-width:460px;margin:auto}
.center .fl{align-items:stretch;text-align:left;width:100%}.center .pick{justify-content:flex-start}
.logo-l{width:110px;height:110px;object-fit:contain}.logo-l.sm{width:72px;height:72px}
.reg .fl,.reg .seg{width:100%}.reg .seg{display:flex}.reg .seg button{flex:1}
/* layout */
.shell{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
.side{background:#fff;border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:14px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px}.brand img{width:34px;height:34px}.brand b{font-size:15px;color:var(--brand)}
.side nav{display:flex;flex-direction:column;gap:2px;flex:1}
.side nav a,.tabs a{position:relative;display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:9px;text-decoration:none;color:#475569;font-weight:500}
.side nav a:hover{background:#f1f5f9}.side nav a.on{background:#eceffa;color:var(--brand);font-weight:600}
.side nav a em{position:static;margin-left:auto}
.me{display:flex;align-items:center;gap:9px;border-top:1px solid var(--line);padding-top:12px}.me div{flex:1;min-width:0}.me b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.me span{font-size:11.5px;color:var(--mut)}
main{min-width:0}
.top{position:sticky;top:0;z-index:5;background:rgba(245,246,248,.92);backdrop-filter:blur(8px);display:flex;align-items:center;gap:10px;padding:12px 24px;border-bottom:1px solid var(--line)}
.top-l{display:flex;align-items:center;gap:10px;flex:1}.top-logo{display:none;width:30px;height:30px}.top-team{display:flex}
.mob-out{display:none}
.view{padding:20px 24px 110px;max-width:1180px;margin:auto}
.tabs{display:none}
@media(max-width:900px){
 .shell{display:block}.side{display:none}
 .top{padding:10px 14px}.top-logo{display:block}.mob-out{display:inline-grid}.view{padding:14px 12px 120px}
 .tabs{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:20;background:#fff;border-top:1px solid var(--line);overflow-x:auto;padding:6px 6px calc(6px + env(safe-area-inset-bottom));gap:2px;scrollbar-width:none}
 .tabs::-webkit-scrollbar{display:none}
 .tabs a{flex:1 0 auto;min-width:64px;flex-direction:column;gap:2px;padding:6px 8px;font-size:10.5px;text-align:center}
 .tabs a.on{background:#eceffa;color:var(--brand);font-weight:600}.tabs a em{top:0;right:8px}
 .top-team .tchip b{display:none}
}
/* tarjetas */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:14px;box-shadow:var(--sh)}
.card summary{cursor:pointer;list-style:none}.card summary::-webkit-details-marker{display:none}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}.sec-h h3{display:flex;align-items:center;gap:8px}
.sec-h em{font-style:normal;background:#eef0f4;color:var(--mut);border-radius:10px;padding:0 8px;font-size:12px;font-weight:600}
.empty{text-align:center;padding:26px 12px;color:var(--mut);display:flex;flex-direction:column;gap:3px}.empty b{color:var(--txt)}
.center-s{text-align:center}.center-s p{max-width:480px;margin:6px auto 14px}
.warn{background:#fffbeb;border:1px solid #fde68a;color:#92400e;border-radius:10px;padding:9px 12px;margin-bottom:12px}
.alerts{display:flex;gap:8px;margin-bottom:12px}.al{border-radius:20px;padding:4px 12px;font-weight:600;font-size:12.5px}.al.red{background:#fee2e2;color:#b91c1c}.al.amber{background:#fef3c7;color:#92400e}
/* chips */

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import { initializeFirestore, getFirestore, persistentLocalCache, persistentMultipleTabManager, doc, collection, getDoc, setDoc, updateDoc, deleteDoc, onSnapshot, getDocs, writeBatch, query, where, arrayUnion } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
// ---------- Lógica pura (se prueba en node) ----------
const STATUS = { requested: 'Solicitada', todo: 'Por hacer', doing: 'En progreso', review: 'En revisión', done: 'Hecha', rejected: 'Rechazada' };
const COLS = ['todo', 'doing', 'review', 'done'];
const PRIO = { 1: 'Baja', 2: 'Media', 3: 'Alta', 4: 'Urgente' };
const DEF_AREAS = [
  { id: 'cad', name: 'CAD', color: '#3b4a5a' },
  { id: 'mec', name: 'Mecánica', color: '#253264' },
  { id: 'pro', name: 'Programación y Eléctrica', color: '#dc2626' },
  { id: 'com', name: 'Community Strategy', color: '#7c3aed' },
  { id: 'des', name: 'Desempeño y Estrategia', color: '#f97316' }
];
const DEF_TEAM_COLORS = ['#2563eb', '#16a34a', '#d97706', '#9333ea', '#0891b2', '#be123c'];
const DEF_MASTERS = [
  { title: 'Dejar recogida la mesa de trabajo', photoRequired: true },
  { title: 'Dejar recogida la jaula de herramienta', photoRequired: false },
  { title: 'Dejar recogida la pedacería', photoRequired: false },
  { title: 'Dejar recogida el área de corte', photoRequired: false }
];

const pad = n => String(n).padStart(2, '0');
const iso = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const todayISO = () => iso(new Date());
const parseISO = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parseISO(s); d.setDate(d.getDate() + n); return iso(d); };
const daysBetween = (a, b) => Math.round((parseISO(b) - parseISO(a)) / 864e5); // b - a
const MONTHS = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
const DOWS = ['dom', 'lun', 'mar', 'mié', 'jue', 'vie', 'sáb'];
const fmtDate = s => { if (!s) return '—'; const d = parseISO(s); return DOWS[d.getDay()] + ' ' + d.getDate() + ' ' + MONTHS[d.getMonth()].slice(0, 3); };

// Día de trabajo: lunes a viernes; sábado y domingo solo si el mentor los activó
function isWorkday(s, cfg) { const dw = parseISO(s).getDay(); if (dw >= 1 && dw <= 5) return true; if (dw === 6) return !!(cfg && cfg.sat); return !!(cfg && cfg.sun); }

const arr = x => Array.isArray(x) ? x : [];
const isMentor = u => !!u && u.role === 'mentor';
const isCore = u => isMentor(u) && u.rank === 'core';
// ¿Qué áreas gestiona este mentor? null = todas
const mentorAreas = u => isCore(u) ? null : arr(u && u.areas);
const inScopeArea = (u, areaId) => { const a = mentorAreas(u); return a === null || a.includes(areaId); };

// Alumnos a los que se asigna una tarea (resuelve "toda el área")
function taskAssignees(task, users) {
  if (task.assignArea) return users.filter(u => u.role === 'student' && u.team === task.teamId && arr(u.areas).includes(task.areaId)).map(u => u.id);
  return arr(task.assignees);
}
const isMine = (task, me) => !!me && (task.assignArea ? (me.team === task.teamId && arr(me.areas).includes(task.areaId)) : arr(task.assignees).includes(me.id));
const isOverdue = (task, today) => !!task.due && task.due < today && !['done', 'rejected', 'requested'].includes(task.status);
const dueSoon = (task, today) => !!task.due && !['done', 'rejected', 'requested'].includes(task.status) && task.due >= today && daysBetween(today, task.due) <= 1;

// Nivel de confianza por alumno (0–100) sobre sus tareas Hechas
// Entrega a tiempo 35 · tareas regresadas 20 (0 es lo ideal) · anticipación 15 (3+ días = máximo) · participación 30 (1–10)
function confidencePoints(task, score) {
  const first = task.firstSubmittedAt ? iso(new Date(task.firstSubmittedAt)) : (task.doneAt ? iso(new Date(task.doneAt)) : null);
  const onTime = first && task.due ? (first <= task.due ? 1 : 0) : 1;
  const ret = Math.max(0, 1 - 0.34 * (task.returnedCount || 0));
  const early = first && task.due ? Math.max(0, Math.min(1, daysBetween(first, task.due) / 3)) : 0;
  let pts = 35 * onTime + 20 * ret + 15 * early, max = 70;
  if (typeof score === 'number') { pts += 30 * (score / 10); max = 100; }

let app, auth, db;
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => [...(r || document).querySelectorAll(s)];
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const safeImg = s => (typeof s === 'string' && /^data:image\//.test(s)) ? s : '';
const safeUrl = s => /^https?:\/\//i.test(String(s || '').trim()) ? String(s).trim() : '';
const uid8 = () => Math.random().toString(36).slice(2, 10);

const S = {
  auth: null, me: null, booted: false, users: [], teams: [], areas: [], tasks: [], changes: [], reviews: [], masters: [], runs: [], notifs: [], bnotifs: [], feedback: [],
  cfg: { event: 'reto', temporadaEnabled: false, sat: false, sun: false }, comments: [], openId: null,
  f: { team: '', area: '', student: '', status: '', q: '' }, calMonth: null, calDay: null, masterDate: null, err: ''
};
window.__S = S;

// ---- Perfil efectivo (el dueño siempre es Mentor Core)
const isOwner = () => !!S.auth && S.auth.email.toLowerCase() === OWNER_EMAIL.toLowerCase();
const me = () => S.me ? (isOwner() ? { ...S.me, role: 'mentor', rank: 'core' } : S.me) : null;
const amMentor = () => isMentor(me());
const amCore = () => isCore(me());
const evTeams = () => S.teams.filter(t => t.event === S.cfg.event).sort((a, b) => (a.number || 0) - (b.number || 0));
const teamOf = id => S.teams.find(t => t.id === id);
const areaOf = id => S.areas.find(a => a.id === id);
const userOf = id => S.users.find(u => u.id === id);
const evTasks = () => S.tasks.filter(t => (t.eventId || 'reto') === S.cfg.event);
const myScope = t => inScopeArea(me(), t.areaId);
const visTasks = () => evTasks().filter(t => !amMentor() || myScope(t));

// ---- UI base
let rq = 0;
function scheduleRender() { if (rq) return; rq = requestAnimationFrame(() => { rq = 0; try { render(); } catch (e) { console.error(e); } }); }
function toast(msg, bad) { const t = $('#toast'); t.textContent = msg; t.className = 'show' + (bad ? ' bad' : ''); clearTimeout(toast.t); toast.t = setTimeout(() => t.className = '', 3200); }
function openModal(html, cls) { const m = $('#modal'); m.innerHTML = `<div class="bk" data-act="closeModal"></div><div class="sheet ${cls || ''}" role="dialog">${html}</div>`; m.className = 'open'; document.body.classList.add('noscroll'); }
function closeModal() { const m = $('#modal'); m.className = ''; m.innerHTML = ''; document.body.classList.remove('noscroll'); if (S.openId) { S.openId = null; unsubComments(); } }
async function guard(fn) { try { return await fn(); } catch (e) { console.error(e); toast('No se pudo guardar: ' + (e.code || e.message), true); } }

// ---- Imágenes (se comprimen en el dispositivo y se guardan como texto)
function readImage(file, maxSide, q, type) {
  return new Promise((res, rej) => {
    const fr = new FileReader(); fr.onerror = rej;
    fr.onload = () => { const im = new Image(); im.onerror = rej; im.onload = () => {
      const k = Math.min(1, maxSide / Math.max(im.width, im.height)), w = Math.max(1, Math.round(im.width * k)), h = Math.max(1, Math.round(im.height * k));
      const c = document.createElement('canvas'); c.width = w; c.height = h; const x = c.getContext('2d'); if (type === 'image/jpeg') { x.fillStyle = '#fff'; x.fillRect(0, 0, w, h); } x.drawImage(im, 0, 0, w, h);
      res(c.toDataURL(type || 'image/jpeg', q)); }; im.src = fr.result; };
    fr.readAsDataURL(file);
  });
}

// ---- Suscripciones
let subs = [], subSig = '', commentUnsub = null;
const unsubAll = () => { subs.forEach(f => { try { f() } catch (e) { } }); subs = []; subSig = ''; };
const snapList = s => s.docs.map(d => ({ id: d.id, ...d.data() }));
function listen(ref, key, post) { subs.push(onSnapshot(ref, s => { S[key] = post ? post(snapList(s)) : snapList(s); scheduleRender(); }, e => { console.error(key, e); S.err = key + ': ' + (e.code || e.message); scheduleRender(); })); }
const col = n => collection(db, n);
function subscribeData() {
  const m = me(); const sig = m ? [m.role, m.rank, m.team, arr(m.areas).join(','), isOwner()].join('|') : 'anon';
  if (sig === subSig) return; unsubAll(); subSig = sig;
  // siempre: configuración, áreas, equipos y avisos propios
  subs.push(onSnapshot(doc(db, 'config', 'main'), s => { if (s.exists()) S.cfg = { event: 'reto', temporadaEnabled: false, sat: false, sun: false, ...s.data() }; scheduleRender(); }));
  listen(col('areas'), 'areas', l => l.sort((a, b) => (a.order || 0) - (b.order || 0)));
  listen(col('teams'), 'teams');
  if (m) subs.push(onSnapshot(query(col('notifications'), where('to', '==', S.auth.uid)), s => { S.notifs = snapList(s); watchNew('notifs'); scheduleRender(); }, e => console.error('notifs', e)));
  if (!m) return;
  if (m.role === 'student' && m.team) {
    listen(query(col('tasks'), where('teamId', '==', m.team)), 'tasks');
    listen(query(col('users'), where('role', 'in', ['student', 'mentor'])), 'users', l => l.filter(u => u.role === 'mentor' || u.team === m.team || u.id === S.auth.uid));
    listen(col('masterTasks'), 'masters', l => l.sort((a, b) => (a.order || 0) - (b.order || 0)));
    listen(query(col('masterRuns'), where('teamId', '==', m.team)), 'runs');
    listen(query(col('changes'), where('uid', '==', S.auth.uid)), 'changes');
  } else if (m.role === 'mentor') {
    subs.push(onSnapshot(query(col('notifications'), where('to', '==', 'mentors')), s => { S.bnotifs = snapList(s); watchNew('bnotifs'); scheduleRender(); }));
    if (isCore(m)) listen(col('feedback'), 'feedback');

const seenN = {}; let ntT = 0;
function watchNew(key) {
  const list = S[key], ids = new Set(list.map(n => n.id));

function virtualAlerts() {
  if (amMentor()) return []; const today = todayISO(); const out = [];
  evTasks().filter(t => isMine(t, me())).forEach(t => { if (isOverdue(t, today)) out.push({ id: 'o' + t.id, text: `"${t.title}" venció (${fmtDate(t.due)})`, taskId: t.id, kind: 'over' }); else if (dueSoon(t, today)) out.push({ id: 's' + t.id, text: `"${t.title}" vence ${t.due === today ? 'hoy' : 'mañana'}`, taskId: t.id, kind: 'soon' }); });
  return out;
}
ACT.bell = () => {
  const ns = myNotifs().slice(0, 40), va = virtualAlerts();
  openModal(`<div class="sh-h"><h3>Avisos</h3><div><button class="btn sm" data-act="readAll">Marcar leídos</button><button class="ibtn" data-act="closeModal">${svgi('x')}</button></div></div><div class="sh-b">
  ${va.map(a => `<div class="nt warn2" data-act="openTask" data-id="${a.taskId}">${svgi('cal', 16)}<div><b>${esc(a.text)}</b></div></div>`).join('')}
  ${ns.length ? ns.map(n => `<div class="nt ${n.read ? '' : 'new'}" data-act="openNotif" data-id="${n.id}" data-b="${n.broadcast ? 1 : ''}" data-task="${esc(n.taskId)}"><i></i><div><b>${esc(n.text)}</b><span>${fmtTime(n.at)}</span></div></div>`).join('') : (va.length ? '' : empty('Sin avisos', 'Aquí verás tareas nuevas, decisiones y comentarios.'))}</div>`);
};

function goNotif(n) {
  markRead(n); closeModal();
  const t = n.taskId && S.tasks.find(x => x.id === n.taskId); if (t) return ACT.openTask({ dataset: { id: t.id } });
  const mn = amMentor(); let go = n.go || ({ reg: mn ? 'bandeja' : 'mis', master: mn ? 'maestras' : 'mis', fb: 'config', change: mn ? 'bandeja' : 'solicitudes', req: mn ? 'bandeja' : 'solicitudes', sub: 'bandeja' }[n.type] || '');

}

// ---- Formulario de tarea (mentor crea/edita, alumno solicita)

  <div class="row2"><label class="fl">Área<select id="tfArea" data-chg="tfSync"><option value="">Elige…</option>${areas.map(a => `<option value="${a.id}" ${a.id === F.areaId ? 'selected' : ''}>${esc(a.name)}</option>`).join('')}</select></label>

const RUNPH = {};

// ===== Calendario (alumno y mentor)
function calendarHTML() {

function confChart(series) {

}

ACT.mdCell = el => { const mt = S.masters.find(x => x.id === el.dataset.m); mdRun([{ team: el.dataset.t, mt }], el.dataset.mode, () => el.dataset.mode === 'done' ? 'Marcada como entregada' : 'Reabierta'); };
ACT.mdAll = el => { const mt = S.masters.find(x => x.id === el.dataset.m), d = S.masterDate || today(); if (!confirm(`¿Marcar "${mt.title}" como entregada para todos los equipos el ${fmtDate(d)}?`)) return; mdRun(mdPairs([mt]), 'done', n => `Marcada para ${n} equipo${n === 1 ? '' : 's'}`); };
ACT.mdUndo = el => { const mt = S.masters.find(x => x.id === el.dataset.m), d = S.masterDate || today(); if (!confirm(`¿Deshacer "${mt.title}" para todos los equipos el ${fmtDate(d)}?\nLas que mandaron los alumnos con foto vuelven a En revisión; las que marcaste tú se quitan.`)) return; mdRun(mdPairs([mt]), 'undo', n => `Deshecha en ${n} equipo${n === 1 ? '' : 's'}`); };
ACT.mdAllDay = () => { const d = S.masterDate || today(); if (!confirm(`¿Marcar TODAS las tareas maestras como entregadas para todos los equipos el ${fmtDate(d)}?`)) return; mdRun(mdPairs(S.masters.filter(x => x.active)), 'done', n => `${n} entrega${n === 1 ? '' : 's'} marcada${n === 1 ? '' : 's'}`); };
ACT.mdUndoDay = () => { const d = S.masterDate || today(); if (!confirm(`¿Deshacer todas las entregas del ${fmtDate(d)}?\nLas que mandaron los alumnos con foto vuelven a En revisión; las que marcaste tú se quitan.`)) return; mdRun(mdPairs(S.masters.filter(x => x.active)), 'undo', n => `${n} entrega${n === 1 ? '' : 's'} deshecha${n === 1 ? '' : 's'}`); };
ACT.mdNav = el => { const n = Number(el.dataset.n); S.masterDate = n ? addDays(S.masterDate || today(), n) : today(); scheduleRender(); };
ACT.runOk = el => guard(async () => { await decideRun(S.runs.find(r => r.id === el.dataset.id), true); toast('Aprobada'); });
ACT.runNo = el => { const r = S.runs.find(x => x.id === el.dataset.id); const c = prompt('¿Qué falta? (opcional)', ''); if (c === null) return; guard(async () => { await decideRun(r, false, c.trim()); toast('Regresada'); }); };
const mtForm = m => openModal(`<div class="sh-h"><h3>${m ? 'Editar' : 'Nueva'} tarea maestra</h3><button class="ibtn" data-act="closeModal">${svgi('x')}</button></div><div class="sh-b"><label class="fl">Nombre<input id="mtT" value="${esc(m ? m.title : '')}" placeholder="Ej. Dejar recogida la mesa"></label><label class="pk ${!m || m.photoRequired ? 'on' : ''}"><input type="checkbox" id="mtP" ${m && m.photoRequired ? 'checked' : ''}><i></i>Lleva foto como evidencia</label><p class="tiny mut">Aparece todos los días de trabajo para todos los equipos.</p><div class="acts"><button class="btn primary" data-act="mtSave" data-id="${m ? m.id : ''}">Guardar</button></div></div>`);
ACT.mtNew = () => mtForm(null); ACT.mtEdit = el => mtForm(S.masters.find(x => x.id === el.dataset.id));
ACT.mtSave = el => { const title = $('#mtT').value.trim(); if (!title) return toast('Falta el nombre', true); guard(async () => { const id = el.dataset.id; if (id) await updateDoc(doc(db, 'masterTasks', id), { title, photoRequired: $('#mtP').checked }); else await setDoc(doc(col('masterTasks')), { title, photoRequired: $('#mtP').checked, active: true, order: S.masters.length }); closeModal(); toast('Guardado'); }); };
ACT.mtToggle = el => guard(() => { const m = S.masters.find(x => x.id === el.dataset.id); return updateDoc(doc(db, 'masterTasks', m.id), { active: !m.active }); });

// ----- Ajustes
function vConfig() {
  const teams = evTeams();
  return `<div class="card">${secH('Evento activo')}<div class="seg"><button class="${S.cfg.event === 'reto' ? 'on' : ''}">Reto interno</button><button disabled title="Todavía deshabilitada">Temporada</button></div><p class="tiny mut">Temporada está deshabilitada por ahora. Cada tarea pertenece a un evento.</p></div>
  ${amCore() ? feedbackCard() : ''}
  ${amCore() ? `<div class="card">${secH('Zona de pruebas')}<p class="tiny mut">Borra todas las tareas, comentarios, calificaciones, solicitudes de cambio, entregas de tareas maestras y avisos. <b>No borra personas, equipos, áreas ni la lista de tareas maestras.</b></p><button class="btn danger" data-act="resetData">Reiniciar datos de tareas</button><p class="tiny mut" style="margin-top:8px">Versión de la app: v${APP_VERSION}</p></div>` : ''}
  <div class="card">${secH('Días de trabajo')}<p class="tiny mut">De lunes a viernes siempre. Agrega fin de semana si hace falta.</p><div class="pick"><label class="pk ${S.cfg.sat ? 'on' : ''}"><input type="checkbox" data-chg="cfgDay" data-k="sat" ${S.cfg.sat ? 'checked' : ''}><i></i>Sábado</label><label class="pk ${S.cfg.sun ? 'on' : ''}"><input type="checkbox" data-chg="cfgDay" data-k="sun" ${S.cfg.sun ? 'checked' : ''}><i></i>Domingo</label></div></div>
  <div class="card">${secH('Equipos', teams.length, `<button class="btn sm" data-act="teamNew">${svgi('plus', 14)} Equipo</button>`)}${teams.map(t => `<div class="req"><div class="trow">${teamDot(t.id)}<div><b>${esc(t.name)}</b><span class="tiny mut">Equipo ${t.number} · <i class="sw" style="background:${esc(t.color)}"></i>${esc(t.color)}</span></div></div><div class="rbt"><button class="btn sm" data-act="teamEdit" data-id="${t.id}">Editar</button></div></div>`).join('') || empty('Sin equipos')}</div>
  <div class="card">${secH('Áreas', S.areas.length, `<button class="btn sm" data-act="areaNew">${svgi('plus', 14)} Área</button>`)}${S.areas.map(a => `<div class="req"><div class="trow">${areaChip(a.id)}<span class="tiny mut">${esc(a.color)}</span></div><div class="rbt"><button class="btn sm" data-act="areaEdit" data-id="${a.id}">Editar</button></div></div>`).join('')}</div>`;
}
function feedbackCard() {
  const l = S.feedback.slice().sort((a, b) => (a.status === 'new' ? 0 : 1) - (b.status === 'new' ? 0 : 1) || b.at - a.at), n = l.filter(f => f.status === 'new').length;
  return `<div class="card" id="fbCard">${secH('Reportes y sugerencias', n || null, `<span class="mut tiny">${l.length} en total</span>`)}${l.map(f => `<div class="fbi ${f.status === 'new' ? 'new' : ''}"><div class="fbi-h"><span class="st st-${f.kind === 'bug' ? 'rejected' : 'doing'}">${f.kind === 'bug' ? 'Falla' : 'Sugerencia'}</span><b>${esc(f.name)}</b><span class="tiny mut">${f.role === 'mentor' ? 'Mentor' : 'Alumno' + (f.teamId ? ' · ' + esc(teamLabel(f.teamId)) : '')} · ${fmtTime(f.at)}</span></div>
    <p>${esc(f.text)}</p>${safeImg(f.photo) ? `<img class="thumb big zoom fbimg" src="${safeImg(f.photo)}" alt="">` : ''}<span class="tiny mut">Pantalla: ${esc(f.view)} · v${esc(f.version)} · ${esc(f.screen || '')}</span>
    <div class="rbt l"><button class="btn sm ${f.status === 'new' ? 'primary' : ''}" data-act="fbDone" data-id="${f.id}">${f.status === 'new' ? 'Marcar resuelto' : 'Reabrir'}</button><button class="btn sm danger ghost" data-act="fbDel" data-id="${f.id}">Borrar</button></div></div>`).join('') || empty('Sin reportes', 'Aquí llegan las fallas y sugerencias del equipo.')}</div>`;
}
ACT.fbDone = el => { const f = S.feedback.find(x => x.id === el.dataset.id); guard(() => setFeedback(f, { status: f.status === 'new' ? 'done' : 'new' })); };
ACT.fbDel = el => { const f = S.feedback.find(x => x.id === el.dataset.id); if (!confirm('¿Borrar este reporte?')) return; guard(() => delFeedback(f)); };
CHG.cfgDay = el => guard(() => saveCfg({ [el.dataset.k]: el.checked }));
let TF = null;
function teamForm(t) { TF = { id: t ? t.id : '', logo: t ? t.logo || '' : '' }; openModal(`<div class="sh-h"><h3>${t ? 'Editar' : 'Nuevo'} equipo</h3><button class="ibtn" data-act="closeModal">${svgi('x')}</button></div><div class="sh-b">
  <div class="row2"><label class="fl">Número<input id="tmN" type="number" min="1" value="${t ? t.number : evTeams().reduce((a, x) => Math.max(a, x.number || 0), 0) + 1}"></label><label class="fl">Nombre<input id="tmName" value="${esc(t ? t.name : '')}" placeholder="Nombre del equipo"></label></div>
  <div class="row2"><label class="fl">Color (HEX)<input id="tmC" value="${esc(t ? t.color : DEF_TEAM_COLORS[0])}" placeholder="#2563eb"></label><div class="fl">Logo<div class="logoup"><span id="tmPrev">${TF.logo ? `<img src="${safeImg(TF.logo)}" alt="">` : '—'}</span><label class="btn sm">Subir<input type="file" accept="image/*" hidden data-chg="tmFile"></label></div></div></div>
  <div class="acts"><button class="btn primary" data-act="teamSave">Guardar</button></div></div>`); }
ACT.teamNew = () => teamForm(null); ACT.teamEdit = el => teamForm(teamOf(el.dataset.id));
CHG.tmFile = async el => { const f = el.files[0]; if (!f) return; try { TF.logo = await readImage(f, 256, 0.9, 'image/png'); $('#tmPrev').innerHTML = `<img src="${TF.logo}" alt="">`; } catch (e) { toast('No se pudo leer la imagen', true); } };
ACT.teamSave = () => { const n = Number($('#tmN').value), name = $('#tmName').value.trim() || 'Equipo ' + n, c = $('#tmC').value.trim(); if (!n) return toast('Falta el número', true); if (!validHex(c)) return toast('El color debe ser un HEX como #2563eb', true); guard(async () => { const id = TF.id || S.cfg.event + '-' + n; await setDoc(doc(db, 'teams', id), { event: S.cfg.event, number: n, name, color: c, logo: TF.logo || '' }, { merge: true }); closeModal(); toast('Equipo guardado'); }); };
let AF = null;
function areaForm(a) { AF = a ? a.id : ''; openModal(`<div class="sh-h"><h3>${a ? 'Editar' : 'Nueva'} área</h3><button class="ibtn" data-act="closeModal">${svgi('x')}</button></div><div class="sh-b"><label class="fl">Nombre<input id="arN" value="${esc(a ? a.name : '')}"></label><label class="fl">Color (HEX)<input id="arC" value="${esc(a ? a.color : '#0891b2')}"></label><div class="acts"><button class="btn primary" data-act="areaSave">Guardar</button></div></div>`); }
ACT.areaNew = () => areaForm(null); ACT.areaEdit = el => areaForm(areaOf(el.dataset.id));
ACT.areaSave = () => { const name = $('#arN').value.trim(), c = $('#arC').value.trim(); if (!name) return toast('Falta el nombre', true); if (!validHex(c)) return toast('El color debe ser un HEX como #dc2626', true); guard(async () => { const id = AF || slug(name) + uid8().slice(0, 3); await setDoc(doc(db, 'areas', id), { name, color: c, order: AF ? (areaOf(AF).order || 0) : S.areas.length }, { merge: true }); closeModal(); toast('Área guardada'); }); };

// ---------- Render principal y arranque ----------
const VIEWS = { mis: vMis, equipo: vEquipo, cal: calendarHTML, solicitar: vSolicitar, solicitudes: vSolicitudes, panel: vPanel, bandeja: vBandeja, tablero: vTablero, lista: vLista, alumnos: vAlumnos, maestras: vMaestras, config: vConfig };
function render() {
  const el = $('#app');
  if (!FB_CONFIG) { el.innerHTML = setupHTML(); return; }
  if (!S.booted) { el.innerHTML = loadingHTML(); return; }
  if (!S.auth) { el.innerHTML = loginHTML(); return; }
  const m = me();
  if (!m) { el.innerHTML = registerHTML(); return; }
  if (m.role === 'pending') { el.innerHTML = waitHTML('pending'); return; }
  if (m.role === 'rejected') { el.innerHTML = waitHTML('rejected'); return; }
  if (m.role === 'inactive') { el.innerHTML = waitHTML('inactive'); return; }
  if (m.role === 'student' && !m.team) { el.innerHTML = waitHTML('noteam'); return; }
  const r = route();
  // no redibujar mientras se escribe en la página (evita perder lo tecleado)
  const ae = document.activeElement; if (ae && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName) && el.contains(ae) && ae.dataset && ae.dataset.inp) { const v = ae.value, s = ae.selectionStart; el.innerHTML = shellHTML(VIEWS[r](), r); const n = $('#' + ae.id); if (n) { n.focus(); try { n.setSelectionRange(s, s); } catch (e) { } } }
  else el.innerHTML = shellHTML(VIEWS[r](), r);
  refreshTaskModal(); updateTitle();
}
window.addEventListener('hashchange', () => { S.calDay = null; scheduleRender(); });

document.addEventListener('click', e => {
  const im = e.target.closest && e.target.closest('img.thumb, img.zoom, .cm img'); if (im && im.src && !im.closest('.av')) { const l = $('#lb'); l.innerHTML = `<img src="${esc(im.src)}" alt="">`; l.className = 'open'; return; }
  const a = e.target.closest('[data-act]'); if (!a) return; const f = ACT[a.dataset.act]; if (!f) return;
  if (a.tagName !== 'A' && a.type !== 'checkbox') e.preventDefault(); f(a, e);
});
document.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('[data-act][tabindex]')) { e.preventDefault(); e.target.click(); } if (e.key === 'Escape' && $('#modal').className === 'open') closeModal(); });
document.addEventListener('change', e => { const t = e.target; if (t.dataset && t.dataset.chg && CHG[t.dataset.chg]) CHG[t.dataset.chg](t, e); if (t.matches && t.matches('.pk input')) t.closest('.pk').classList.toggle('on', t.checked); });
document.addEventListener('input', e => { const t = e.target; if (t.dataset && t.dataset.inp === 'fQ') { S.f.q = t.value; scheduleRender(); } });

// ---- Acceso
ACT.login = async () => {
  S.err = ''; try { const p = new GoogleAuthProvider(); p.setCustomParameters({ prompt: 'select_account' }); await signInWithPopup(auth, p); }
  catch (e) { if (e.code === 'auth/popup-blocked') { try { await signInWithRedirect(auth, new GoogleAuthProvider()); } catch (x) { S.err = 'No se pudo abrir el acceso con Google.'; } } else if (e.code !== 'auth/popup-closed-by-user' && e.code !== 'auth/cancelled-popup-request') S.err = 'No se pudo iniciar sesión (' + (e.code || e.message) + ')'; scheduleRender(); }
};
ACT.logout = async () => { unsubAll(); closeModal(); await signOut(auth); };
ACT.resetData = () => {
  if (!amCore()) return;
  if (!confirm('¿Borrar TODAS las tareas, comentarios, calificaciones, cambios, entregas maestras y avisos?\n\nLas personas, equipos y áreas se conservan. Esto no se puede deshacer.')) return;
  const w = prompt('Escribe REINICIAR para confirmar'); if (w === null || w.trim().toUpperCase() !== 'REINICIAR') return toast('Cancelado', false);
  guard(async () => { const n = await resetTaskData(); toast('Datos reiniciados (' + n + ' registros)'); });
};
ACT.regMode = el => { R.name = ($('#rgName') || {}).value || R.name; R.mode = el.dataset.m; scheduleRender(); };
CHG.regArea = el => { R.areas = el.checked ? [...new Set([...R.areas, el.value])] : R.areas.filter(x => x !== el.value); if (R.mode === 'mentor' && R.areas.length > 1 && el.checked) { /* el mentor puede tener varias áreas */ } };
ACT.regSend = () => { const name = $('#rgName').value.trim(); R.name = name; if (name.split(/\s+/).filter(w => w.length > 1).length < 2) return toast('Escribe tu nombre completo, con apellidos', true); if (!R.areas.length) return toast('Elige al menos un área', true); guard(async () => { await register({ requested: R.mode, name, areas: R.areas }); R.name = ''; R.areas = []; R.mode = 'student'; toast('Solicitud enviada'); }); };

(function boot() {
  if (!FB_CONFIG) { S.booted = true; return render(); }
  app = initializeApp(FB_CONFIG); auth = getAuth(app);
  try { db = initializeFirestore(app, { localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) }); } catch (e) { db = getFirestore(app); }
  getRedirectResult(auth).catch(e => { S.err = 'No se pudo iniciar sesión (' + (e.code || e.message) + ')'; scheduleRender(); });
  onAuthStateChanged(auth, bootAuth);
  render();
})();

</script></body></html>
